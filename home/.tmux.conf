# ---- Terminal and colours ------------------------------------------------
# iTerm supports 24-bit colour; pass that through so vim's termguicolors works.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Send Esc to vim at once. The 500 ms default makes leaving insert mode lag.
set -sg escape-time 10
# Lets vim see focus changes, so it can reload files edited elsewhere.
set -g focus-events on

# ---- Bells: off, from every window ------------------------------------------
set -g bell-action none
set -g monitor-bell off
set -g visual-bell off
set -g visual-activity off

# ---- Scrollback and copy mode ------------------------------------------------
# Sanitizer reports and template errors are long.
set -g history-limit 50000
# prefix [ enters copy mode: move with vim keys, v to select, y to copy to the
# macOS clipboard, q to leave.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
# Wheel scrolls panes. In iTerm, hold Option to select text the native way.
set -g mouse on

# ---- Panes --------------------------------------------------------------------
# prefix | and prefix - split side by side / stacked, in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# prefix h/j/k/l moves between panes like vim windows.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# prefix r reloads this file.
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
